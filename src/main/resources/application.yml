spring:
  application:
    name: sales-platform
  
  profiles:
    active: dev
  
  # Configuração do JPA
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Configuração do Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration

# Configuração do Springdoc OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: true

# Configuração do Actuator
management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true

# Informações da aplicação (exposto via /actuator/info)
info:
  app:
    name: ${spring.application.name}
    description: Plataforma de Vendas Unificada
    version: 1.0.0-SNAPSHOT

# Configuração de Logging
logging:
  level:
    root: INFO
    br.com.fsj.salesplatform: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

